# Мини-приложение: проверка формул JS = Python и публикация папки webapp/ на GitHub Pages.
# Бот на Deployka это не трогает — там только Python.
name: Mini App

on:
  push:
    branches: [main]
    paths: ["webapp/**", "calculators.py", "design.py", "tests/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["webapp/**", "calculators.py", "design.py", "tests/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install "Pillow>=10.0"
      - name: Эталон из calculators.py
        run: python tests/make_fixtures.py
      - name: Сверка webapp/calc.js с Python
        run: node tests/parity.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
